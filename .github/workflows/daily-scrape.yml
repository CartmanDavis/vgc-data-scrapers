name: Scrape

on:
  schedule:
    - cron: '0 */12 * * *'  # every 12 hours
  workflow_dispatch:          # allow manual runs

jobs:
  scrape-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Write config
        run: echo '${{ secrets.CONFIG_JSON }}' > config.json

      - name: Scrape M-A tournaments
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SINCE=$(date -u -d '2 days ago' '+%Y-%m-%d' 2>/dev/null || date -u -v-2d '+%Y-%m-%d')
          pnpm --filter @vgc/cli run limitless --format M-A --since "$SINCE"

      - name: Process new data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm --filter @vgc/cli run process
